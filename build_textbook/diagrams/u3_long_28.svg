44479-flowchart-EVOL-0" data-look="neo" transform="translate(88, 92.25)"><rect class="basic label-container" style="" x="-76" y="-41.25" width="152" height="82.5"></rect><g class="label" style="" transform="translate(-60, -29.25)"><rect></rect><foreignObject width="120" height="58.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>Evolution of Host IP Configuration Protocols</p></span></div></foreignObject></g></g><g class="node default  " id="d_u3_long_28_1791381744479-flowchart-MAN-1" data-look="neo" transform="translate(280, 92.25)"><rect class="basic label-container" style="" x="-76" y="-80.25" width="152" height="160.5"></rect><g class="label" style="" transform="translate(-60, -68.25)"><rect></rect><foreignObject width="120" height="136.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>1. Manual Configuration<br/>- Error-prone, static, high administrative burden<br/>- Frequent duplicate IP address conflicts</p></span></div></foreignObject></g></g><g class="node default  " id="d_u3_long_28_1791381744479-flowchart-RARP-2" data-look="neo" transform="translate(280, 292.75)"><rect class="basic label-container" style="" x="-76" y="-80.25" width="152" height="160.5"></rect><g class="label" style="" transform="translate(-60, -68.25)"><rect></rect><foreignObject width="120" height="136.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>2. RARP (RFC 903 - Layer 2)<br/>- Resolves MAC to IP<br/>- Cannot cross routers, no gateway or DNS delivery</p></span></div></foreignObject></g></g><g class="node default  " id="d_u3_long_28_1791381744479-flowchart-BOOTP-3" data-look="neo" transform="translate(280, 493.25)"><rect class="basic label-container" style="" x="-76" y="-80.25" width="152" height="160.5"></rect><g class="label" style="" transform="translate(-60, -68.25)"><rect></rect><foreignObject width="120" height="136.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>3. BOOTP (RFC 951 - UDP 67/68)<br/>- Traverses routers via Relay Agents<br/>- Static pre-configured 1:1 MAC-to-IP binding only</p></span></div></foreignObject></g></g><g class="node default  " id="d_u3_long_28_1791381744479-flowchart-DHCP-4" data-look="neo" transform="translate(280, 723)"><rect class="basic label-container" style="" x="-76" y="-109.5" width="152" height="219"></rect><g class="label" style="" transform="translate(-60, -97.5)"><rect></rect><foreignObject width="120" height="195"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel "><p>4. DHCP (RFC 2131 - Modern Standard)<br/>- Dynamic IP Pooling, Temporary Leases<br/>- Distributes IP, Mask, Gateway, DNS, MTU automatically</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="d_u3_long_28_1791381744479-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="d_u3_long_28_1791381744479-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><linearGradient id="d_u3_long_28_1791381744479-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"></stop><stop offset="100%" stop-color="