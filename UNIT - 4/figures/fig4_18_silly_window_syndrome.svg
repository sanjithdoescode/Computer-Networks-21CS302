2-3281036510-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 350.905318 177.60808 C 424.200012 201 453 207 489 207" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3281036510-3488378134)" mask="url(#d2-3281036510)" /></g><g class="KHByb2JsZW0gLSZndDsgY2xhcmspWzBd"><path d="M 350.905318 78.39192 C 424.200012 55 456.299988 49 505.5 49" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3281036510-3488378134)" mask="url(#d2-3281036510)" /></g><mask id="d2-3281036510" maskUnits="userSpaceOnUse" x="-101" y="-101" width="1032" height="458">
