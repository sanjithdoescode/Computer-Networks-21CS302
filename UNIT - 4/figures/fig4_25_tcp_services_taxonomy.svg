		.d2-367107916 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="dGNwX3NlcnZpY2Vz"><g class="shape" ><rect x="20" y="56" width="451" height="1260" stroke="#0A0F25" fill="#CFD2DD" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="245.5" y="43" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">Ten-Pillar Architecture of TCP Services</text></g><g class="dGNwX3NlcnZpY2VzLnMx"><g class="shape" ><rect x="82" y="86" width="327" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="245.5" y="124.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">1. Process-to-Process Delivery (Sockets)</text></g><g class="dGNwX3NlcnZpY2VzLnMy"><g class="shape" ><rect x="96" y="212" width="300" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="250.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">2. Stream Delivery (Circular Buffers)</text></g><g class="dGNwX3NlcnZpY2VzLnMz"><g class="shape" ><rect x="118" y="338" width="256" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="376.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">3. Full-Duplex &amp; Piggybacking</text></g><g class="dGNwX3NlcnZpY2VzLnM0"><g class="shape" ><rect x="106" y="464" width="280" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="502.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4. 4-Tuple Socket Demultiplexing</text></g><g class="dGNwX3NlcnZpY2VzLnM1"><g class="shape" ><rect x="99" y="590" width="293" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="245.5" y="628.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">5. Connection-Oriented State (TCB)</text></g><g class="dGNwX3NlcnZpY2VzLnM2"><g class="shape" ><rect x="100" y="716" width="292" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="754.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">6. Reliable Delivery &amp; Error Control</text></g><g class="dGNwX3NlcnZpY2VzLnM3"><g class="shape" ><rect x="72" y="842" width="348" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="880.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">7. Flow Control (rwnd &amp; Persistence Timer)</text></g><g class="dGNwX3NlcnZpY2VzLnM4"><g class="shape" ><rect x="64" y="968" width="364" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="1006.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">8. Congestion Control (AIMD &amp; Fast Recovery)</text></g><g class="dGNwX3NlcnZpY2VzLnM5"><g class="shape" ><rect x="87" y="1094" width="318" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="246" y="1132.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">9. QoS &amp; Control Flags (URG, PSH, RST)</text></g><g class="dGNwX3NlcnZpY2VzLnMxMA=="><g class="shape" ><rect x="50" y="1220" width="391" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="245.5" y="1258.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">10. Dynamic Timers (RTO, Keepalive, TIME_WAIT)</text></g><mask id="d2-367107916" maskUnits="userSpaceOnUse" x="-81" y="-85" width="653" height="1502">
