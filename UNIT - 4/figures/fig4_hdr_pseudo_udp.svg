<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<rect x="10" y="10" width="800" height="220" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="410.0" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IPv4 / UDP Pseudo-Header Layout (12 Octets for Checksum Calculation)</text>
<rect x="40" y="50" width="740" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="43.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 0</text>
<text x="135.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 4</text>
<line x1="132.5" y1="50" x2="132.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="228.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 8</text>
<line x1="225.0" y1="50" x2="225.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="320.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 12</text>
<line x1="317.5" y1="50" x2="317.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="413.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 16</text>
<line x1="410.0" y1="50" x2="410.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="505.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 20</text>
<line x1="502.5" y1="50" x2="502.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 24</text>
<line x1="595.0" y1="50" x2="595.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="690.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 28</text>
<line x1="687.5" y1="50" x2="687.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="759.875" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 31</text>
<rect x="40" y="78" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Source IPv4 Address</text>
<text x="410.0" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits (From IPv4 Packet Header)</text>
<rect x="40" y="122" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Destination IPv4 Address</text>
<text x="410.0" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits (From IPv4 Packet Header)</text>
<rect x="40" y="166" width="185.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="132.5" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">All Zeros</text>
<text x="132.5" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b (0x00)</text>
<rect x="225.0" y="166" width="185.0" height="44" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="317.5" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Protocol</text>
<text x="317.5" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b (0x11 = 17 for UDP)</text>
<rect x="410.0" y="166" width="370.0" height="44" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.2"/>
<text x="595.0" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">UDP Length</text>
<text x="595.0" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">16 Bits (Matches UDP Header Length)</text>
</svg>