		.d2-2776955082 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bDc="><g class="shape" ><rect x="41" y="0" width="673" height="66" stroke="#0A0F25" fill="#eff6ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="377.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">7. Application Layer: Network virtual terminal, file transfer, web, email (HTTP, DNS, SSH)</text></g><g class="bDY="><g class="shape" ><rect x="55" y="166" width="644" height="66" stroke="#0A0F25" fill="#e0e7ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="377" y="204.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">6. Presentation Layer: Syntax, semantics, translation, encryption (TLS), compression</text></g><g class="bDU="><g class="shape" ><rect x="32" y="332" width="690" height="66" stroke="#0A0F25" fill="#ede9fe" class=" stroke-B1" style="stroke-width:2;" /></g><text x="377" y="370.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">5. Session Layer: Dialogue control, token management, session checkpoint synchronization</text></g><g class="bDQ="><g class="shape" ><rect x="35" y="498" width="684" height="66" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="377" y="536.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4. Transport Layer: End-to-end reliability, segmenting, flow/congestion control (TCP, UDP)</text></g><g class="bDM="><g class="shape" ><rect x="8" y="664" width="738" height="66" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="377" y="702.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">3. Network Layer: Host-to-host logical addressing, routing, forwarding, fragmentation (IPv4, IPv6)</text></g><g class="bDI="><g class="shape" ><rect x="17" y="830" width="720" height="66" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="377" y="868.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">2. Data Link Layer: Hop-to-hop framing, 48-bit MAC addressing, error detection (Ethernet, Wi-Fi)</text></g><g class="bDE="><g class="shape" ><rect x="0" y="996" width="754" height="66" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="377" y="1034.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">1. Physical Layer: Transmission of unstructured bit streams over physical media (Twisted Pair, Fiber)</text></g><g class="KGw3IC0mZ3Q7IGw2KVswXQ=="><marker id="mk-d2-2776955082-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 377 68 C 377 106 377 126 377 162" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2776955082-3488378134)" mask="url(#d2-2776955082)" /></g><g class="KGw2IC0mZ3Q7IGw1KVswXQ=="><path d="M 377 234 C 377 272 377 292 377 328" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2776955082-3488378134)" mask="url(#d2-2776955082)" /></g><g class="KGw1IC0mZ3Q7IGw0KVswXQ=="><path d="M 377 400 C 377 438 377 458 377 494" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2776955082-3488378134)" mask="url(#d2-2776955082)" /></g><g cla