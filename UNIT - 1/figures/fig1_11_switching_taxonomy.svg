n x="1046" dy="17.25">• Datagram (Connectionless) vs Virtual Circuit</tspan></text></g><g class="KGNpcmN1aXQgLSZndDsgbWVzc2FnZSlbMF0="><marker id="mk-d2-2149921766-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 294 65 C 332 65 352 65 388 65" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2149921766-3488378134)" mask="url(#d2-2149921766)" /></g><g class="KG1lc3NhZ2UgLSZndDsgcGFja2V0KVswXQ=="><path d="M 762 65 C 800 65 820 65 856 65" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2149921766-3488378134)" mask="url(#d2-2149921766)" /></g><mask id="d2-2149921766" maskUnits="userSpaceOnUse" x="-101" y="-101" width="1434" height="332">
