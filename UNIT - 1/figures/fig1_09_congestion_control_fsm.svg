		.d2-3428325209 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c3M="><g class="shape" ><rect x="18" y="0" width="338" height="98" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="187" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="187" dy="0">Slow Start Phase</tspan><tspan x="187" dy="17.666667">cwnd doubles every RTT: cwnd = cwnd * 2</tspan><tspan x="187" dy="17.666667">Probes available link bandwidth rapidly</tspan></text></g><g class="Y2E="><g class="shape" ><rect x="366" y="219" width="377" height="98" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="554.5" y="257.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="554.5" dy="0">Congestion Avoidance Phase</tspan><tspan x="554.5" dy="17.666667">cwnd grows linearly: cwnd = cwnd + 1 MSS/RTT</tspan><tspan x="554.5" dy="17.666667">Cautious additive increase (AI)</tspan></text></g><g class="ZnI="><g class="shape" ><rect x="474" y="438" width="357" height="98" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="652.5" y="476.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="652.5" dy="0">Fast Retransmit &amp; Recovery (Reno)</tspan><tspan x="652.5" dy="17.666667">Upon 3 Duplicate ACKs:</tspan><tspan x="652.5" dy="17.666667">ssthresh = cwnd / 2, cwnd = ssthresh + 3 MSS</tspan></text></g><g class="dGltZW91dA=="><g class="shape" ><rect x="59" y="438" width="355" height="98" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="236.5" y="476.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="236.5" dy="0">RTO Timeout (Severe Loss)</tspan><tspan x="236.5" dy="17.666667">ssthresh = cwnd / 2</tspan><tspan x="236.5" dy="17.666667">Reset cwnd = 1 MSS (Fall back to Slow Start)</tspan></text></g><g class="KHNzIC0mZ3Q7IGNhKVswXQ=="><marker id="mk-d2-3428325209-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 353.415393 98.075561 C 513.900024 146.300003 554.5 170.699997 554.5 215.5" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="479" y="141" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">cwnd &gt;= ssthresh</text></g><g class="KGNhIC0mZ3Q7IGZyKVswXQ=="><path d="M 611.238764 317.835508 C 664.150024 365.299988 674.950012 389.700012 664.644771 434.601361" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="664.5" y="372" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">3 Duplicate ACKs</text></g><g class="KGZyIC0mZ3Q7IGNhKVswXQ=="><path d="M 594.992181 437.186044 C 540.5 389.700012 529.5 365.299988 540.544847 320.384287" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="540" y="394" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">New ACK Arrives</text></g><g class="KGNhIC0mZ3Q7IHRpbWVvdXQpWzBd"><path d="M 467.270653 317.504668 C 385 365.299988 350.200012 389.700012 297.996816 435.850642" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="377.5" y="376" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Retransmission Timeout</text></g><g class="KHNzIC0mZ3Q7IHRpbWVvdXQpWzBd"><path d="M 210.309494 99.328857 C 231.100006 146.300003 236.5 180.399994 236.5 213.25 C 236.5 246.100006 236.5 389.700012 236.5 434.5" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="236.5" y="271" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Retransmission Timeout</text></g><g class="KHRpbWVvdXQgLSZndDsgc3MpWzBd"><path d="M 157.811947 437.427397 C 82.698997 389.700012 63.5 355.600006 63.5 322.75 C 63.5 289.899994 76.900002 146.300003 127.542238 100.192888" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3428325209-3488378134)" mask="url(#d2-3428325209)" /><text x="64.5" y="285" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Restart at 1 MSS</text></g><mask id="d2-3428325209" maskUnits="userSpaceOnUse" x="-89" y="-101" width="1021" height="738">
