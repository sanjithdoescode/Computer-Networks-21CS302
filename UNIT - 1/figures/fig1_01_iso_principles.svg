" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="2186" dy="0">4. Architectural Simplicity</tspan><tspan x="2186" dy="18.5">Number of layers kept large enough to isolate tasks, but small enough to remain simple</tspan></text></g><g class="KHAxIC0mZ3Q7IHAyKVswXQ=="><marker id="mk-d2-2604921650-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 467 41 C 505 41 525 41 561 41" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2604921650-3488378134)" mask="url(#d2-2604921650)" /></g><g class="KHAyIC0mZ3Q7IHAzKVswXQ=="><path d="M 1175 41 C 1213 41 1233 41 1269 41" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2604921650-3488378134)" mask="url(#d2-2604921650)" /></g><g class="KHAzIC0mZ3Q7IHA0KVswXQ=="><path d="M 1758 41 C 1796 41 1816 41 1852 41" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2604921650-3488378134)" mask="url(#d2-2604921650)" /></g><mask id="d2-2604921650" maskUnits="userSpaceOnUse" x="-101" y="-101" width="2718" height="284">
