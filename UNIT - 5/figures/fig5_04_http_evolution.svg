t></g><g class="aDMw"><g class="shape" ><rect x="1125" y="0" width="273" height="130" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="1261.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1261.5" dy="0">HTTP/3 (2022)</tspan><tspan x="1261.5" dy="17">• QUIC over UDP</tspan><tspan x="1261.5" dy="17">• Zero Transport HoL Blocking</tspan><tspan x="1261.5" dy="17">• 0-RTT Connection Resumption</tspan><tspan x="1261.5" dy="17">• Connection Migration</tspan></text></g><g class="KGgxMCAtJmd0OyBoMTEpWzBd"><marker id="mk-d2-1340787708-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 237 65 C 275 65 295 65 331 65" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1340787708-3488378134)" mask="url(#d2-1340787708)" /></g><g class="KGgxMSAtJmd0OyBoMjApWzBd"><path d="M 647 65 C 685 65 705 65 741 65" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1340787708-3488378134)" mask="url(#d2-1340787708)" /></g><g class="KGgyMCAtJmd0OyBoMzApWzBd"><path d="M 1027 65 C 1065 65 1085 65 1121 65" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1340787708-3488378134)" mask="url(#d2-1340787708)" /></g><mask id="d2-1340787708" maskUnits="userSpaceOnUse" x="-101" y="-101" width="1600" height="332">
