<text x="203.23529411764707" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">1B (10101011)</text>
<rect x="214.11764705882354" y="50" width="130.58823529411765" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="279.4117647058824" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Destination MAC Address</text>
<text x="279.4117647058824" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">6 Bytes (48 Bits)</text>
<rect x="344.7058823529412" y="50" width="130.58823529411765" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.00000000000006" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Source MAC Address</text>
<text x="410.00000000000006" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">6 Bytes (48 Bits)</text>
<rect x="475.2941176470589" y="50" width="43.529411764705884" height="44" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="497.0588235294118" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">EtherType / Length</text>
<text x="497.0588235294118" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">2 Bytes (e.g. 0x0800 IPv4)</text>
