<text x="605.8823529411766" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">MTU Data (Pad to 46B)</text>
<rect x="692.9411764705883" y="50" width="87.05882352941177" height="44" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.2"/>
<text x="736.4705882352941" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">FCS / CRC-32</text>
<text x="736.4705882352941" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">4 Bytes (CRC Polynomial)</text>
