<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 124" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<rect x="10" y="10" width="800" height="104" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="410.0" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">IEEE 802.3 Ethernet Frame Format</text>
<rect x="40" y="50" width="152.3529411764706" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="116.1764705882353" y="69" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Preamble (7 Octets)</text>
<text x="116.1764705882353" y="83" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">7 Bytes (10101010...)</text>
<rect x="192.3529411764706" y="50" width="21.764705882352942" height="44" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
