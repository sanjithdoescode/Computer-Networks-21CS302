		.d2-3793336843 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="aXBfc3BhY2U="><g class="shape" ><rect x="0" y="0" width="344" height="114" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="172" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="172" dy="0">Logical Addressing (Network Layer)</tspan><tspan x="172" dy="17.25">• 32-Bit IPv4 / 128-Bit IPv6</tspan><tspan x="172" dy="17.25">• Hierarchical: Identifies network location</tspan><tspan x="172" dy="17.25">• Changes when device moves subnets</tspan></text></g><g class="bWFjX3NwYWNl"><g class="shape" ><rect x="926" y="0" width="416" height="114" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="1134" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1134" dy="0">Physical Addressing (Data Link Layer)</tspan><tspan x="1134" dy="17.25">• 48-Bit IEEE MAC Address</tspan><tspan x="1134" dy="17.25">• Flat: Globally unique hardware identity (OUI + NIC)</tspan><tspan x="1134" dy="17.25">• Burned into ROM; permanent</tspan></text></g><g class="YXJwX2JyaWRnZQ=="><g class="shape" ><rect x="444" y="16" width="382" height="82" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="635" y="54.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="635" dy="0">ARP Protocol (RFC 826)</tspan><tspan x="635" dy="18.5">Bridges the gap: Dynamically resolves IP -&gt; MAC</tspan></text></g><g class="KGlwX3NwYWNlICZs