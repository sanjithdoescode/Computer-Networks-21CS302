d="mk-d2-71294008-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 372 49 C 410 49 430 49 466 49" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-71294008-3488378134)" mask="url(#d2-71294008)" /></g><g class="KGYyIC0mZ3Q7IGYzKVswXQ=="><path d="M 859 49 C 897 49 917 49 953 49" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-71294008-3488378134)" mask="url(#d2-71294008)" /></g><mask id="d2-71294008" maskUnits="userSpaceOnUse" x="-101" y="-101" width="1473" height="300">
