		.d2-4138198681 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y2xhc3NfZA=="><g class="shape" ><rect x="54" y="0" width="478" height="82" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="293" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="293" dy="0">Class D Multicast IP: 1110 [5 Unmapped Bits] [23 Mapped Bits]</tspan><tspan x="293" dy="18.5">Total 28-bit multicast group address</tspan></text></g><g class="bWFjX3ByZWZpeA=="><g class="shape" ><rect x="79" y="182" width="427" height="98" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="292.5" y="220.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="292.5" dy="0">Ethernet MAC Multicast Prefix: 01:00:5E (Fixed 24 Bits)</tspan><tspan x="292.5" dy="17.666667">+ 1 Bit set to 0 (25th bit)</tspan><tspan x="292.5" dy="17.666667">+ 23 Lower Bits copied directly from IP</tspan></text></g><g class="YW1iaWd1aXR5"><g class="shape" ><rect x="0" y="380" width="585" height="114" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="292.5" y="418.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="292.5" dy="0">The 32:1 Ambiguity:</tspan><tspan x="292.5" dy="17.25">Because 5 IP bits (2^5 = 32) are discarded,</tspan><tspan x="292.5" dy="17.25">32 distinct IP multicast addresses map to the EXACT SAME Ethernet MAC!</tspan><tspan x="292.5" dy="17.25">Network interface card (NIC) accepts frame; host IP stack filters non-targets.</tspan></text></g><g class="KGNsYXNzX2QgLSZndDsgbWFjX3ByZWZpeClbMF0="><marker id="mk-d2-4138198681-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 292.5 84 C 292.5 122 292.5 142 292.5 178" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4138198681-3488378134)" mask="url(#d2-4138198681)" /></g><g class="KG1hY19wcmVmaXggLSZndDsgYW1iaWd1aXR5KVswXQ=="><path d="M 292.5 282 C 292.5 320 292.5 340 292.5 376" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4138198681-3488378134)" mask="url(#d2-4138198681)" /></g><mask id="d2-4138198681" maskUnits="userSpaceOnUse" x="-101" y="-101" width="787" height="696">
