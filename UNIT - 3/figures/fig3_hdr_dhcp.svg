<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 636" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<rect x="10" y="10" width="800" height="616" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="410.0" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">RFC 2131: Dynamic Host Configuration Protocol (DHCP) Message Format</text>
<rect x="40" y="50" width="740" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="43.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 0</text>
<text x="135.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 4</text>
<line x1="132.5" y1="50" x2="132.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="228.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 8</text>
<line x1="225.0" y1="50" x2="225.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="320.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 12</text>
<line x1="317.5" y1="50" x2="317.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="413.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 16</text>
<line x1="410.0" y1="50" x2="410.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="505.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 20</text>
<line x1="502.5" y1="50" x2="502.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 24</text>
<line x1="595.0" y1="50" x2="595.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="690.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 28</text>
<line x1="687.5" y1="50" x2="687.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="759.875" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 31</text>
<rect x="40" y="78" width="185.0" height="44" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="132.5" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">op (1=BOOTREQUEST, 2=BOOTREPLY)</text>
<text x="132.5" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b</text>
<rect x="225.0" y="78" width="185.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="317.5" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">htype (1=Ethernet)</text>
<text x="317.5" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b</text>
<rect x="410.0" y="78" width="185.0" height="44" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.2"/>
<text x="502.5" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">hlen (6=MAC len)</text>
<text x="502.5" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b</text>
<rect x="595.0" y="78" width="185.0" height="44" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="687.5" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">hops (Relay count)</text>
<text x="687.5" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b</text>
<rect x="40" y="122" width="740.0" height="44" fill="#fef3c7" stroke="#fde68a" stroke-width="1.2"/>
<text x="410.0" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">xid (Transaction ID)</text>
<text x="410.0" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits (Random transaction identifier)</text>
<rect x="40" y="166" width="370.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="225.0" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">secs (Elapsed seconds)</text>
<text x="225.0" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">16b</text>
<rect x="410.0" y="166" width="370.0" height="44" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="595.0" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">flags (Broadcast flag B)</text>
<text x="595.0" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">16 Bits (0x8000 = Broadcast)</text>
<rect x="40" y="210" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">ciaddr (Client IP Address: if already bound)</text>
<text x="410.0" y="243" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits</text>
<rect x="40" y="254" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">yiaddr (&#x27;Your&#x27; (Client) IP Address assigned by server)</text>
<text x="410.0" y="287" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits (Leased IP)</text>
<rect x="40" y="298" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="317" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">siaddr (Next Server IP Address in bootstrap)</text>
<text x="410.0" y="331" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits</text>
<rect x="40" y="342" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">giaddr (Relay Agent IP Address)</text>
<text x="410.0" y="375" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">32 Bits (Cross-Subnet Gateway)</text>
<rect x="40" y="386" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">chaddr (Client Hardware MAC Address: 16 Octets)</text>
<text x="410.0" y="419" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Upper bytes of 48-bit MAC</text>
<rect x="40" y="430" width="740.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="449" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">chaddr (Hardware Address Padding to 16 bytes)</text>
<text x="410.0" y="463" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Padding to 16 octets</text>
<rect x="40" y="474" width="740.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">sname (Server Host Name: 64 Octets optional)</text>
<text x="410.0" y="507" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">64 Octets null-terminated string</text>
<rect x="40" y="518" width="740.0" height="44" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="537" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">file (Boot file name: 128 Octets optional)</text>
<text x="410.0" y="551" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">128 Octets boot image path</text>
<rect x="40" y="562" width="740.0" height="44" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.2"/>
<text x="410.0" y="581" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">Magic Cookie (0x63825363) + DHCP Options (Subnet, Router, DNS, Lease Time)</text>
<text x="410.0" y="595" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Variable Options (TLV Format)</text>
</svg>