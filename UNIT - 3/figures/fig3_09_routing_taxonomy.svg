l AS-PATH sequences</tspan><tspan x="189" dy="17.25">• Policy-based inter-domain routing</tspan><tspan x="189" dy="17.25">• Eliminates loops between ASes (BGP-4)</tspan></text></g><mask id="d2-526989140" maskUnits="userSpaceOnUse" x="-101" y="-101" width="579" height="696">
