ss=" stroke-B1" style="stroke-width:2;" /></g><text x="205.5" y="632.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="205.5" dy="0">4. Check Termination</tspan><tspan x="205.5" dy="18.5">Is Tentative set empty?</tspan></text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="52" y="797" width="307" height="82" stroke="#16a34a" fill="#dcfce7" style="stroke-width:2;" /></g><text x="205.5" y="835.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="205.5" dy="0">5. Shortest Path Tree (SPT) Complete</tspan><tspan x="205.5" dy="18.5">Install optimal routes into FIB</tspan></text></g><g class="KGluaXQgLSZndDsgcGljaylbMF0="><marker id="mk-d2-397533771-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0A0F25" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 205 100 C 205 138 205 158 205 194" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-397533771-3488378134)" mask="url(#d2-397533771)" /></g><g class="KHBpY2sgLSZndDsgcmVsYXgpWzBd"><path d="M 255.536443 281.280369 C 302 320 314 340 314 376" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-397533771-3488378134)" mask="url(#d2-397533771)" /></g><g class="KHJlbGF4IC0mZ3Q7IGNoZWNrKVswXQ=="><path d="M 314 496 C 314 534 302 554 257.072885 591.439262" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-397533771-3488378134)" mask="url(#d2-397533771)" /></g><g class="KGNoZWNrIC0mZ3Q7IHBpY2spWzBd"><path d="M 154.463557 592.719631 C 108 554 96 522.599976 96 490.5 C 96 458.399994 108 320 152.927115 282.560738" stroke="#0A0F25" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-397533771-3488378134)" mask="url(#d2-