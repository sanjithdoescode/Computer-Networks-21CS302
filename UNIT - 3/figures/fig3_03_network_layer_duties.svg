-width:2;" /></g><text x="272.5" y="502.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4. Packetizing &amp; Encapsulation: Adding IP headers</text></g><g class="ZHV0aWVzLmQ1"><g class="shape" ><rect x="64" y="590" width="417" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="272.5" y="628.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">5. Fragmentation &amp; Reassembly across varying MTUs</text></g><g class="ZHV0aWVzLmQ2"><g class="shape" ><rect x="85" y="716" width="375" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="272.5" y="754.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">6. Diagnostic Error Reporting: ICMPv4 / ICMPv6</text></g><g class="ZHV0aWVzLmQ3"><g class="shape" ><rect x="61" y="842" width="422" height="66" stroke="#0A0F25" fill="#DEE1EB" class=" stroke-B1 fill-B5" style="stroke-width:2;" /></g><text x="272" y="880.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">7. Quality of Service (QoS) &amp; Congestion Management</text></g><mask id="d2-2842826809" maskUnits="userSpaceOnUse" x="-81" y="-85" width="706" height="1124">
