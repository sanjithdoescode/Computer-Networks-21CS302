		.d2-2882840014 .stroke-B2{stroke:#676C7E;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0A0F25;--color-border-muted:#676C7E;--color-neutral-muted:#EEF1F8;--color-accent-fg:#676C7E;--color-accent-emphasis:#676C7E;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="YWR2"><g class="shape" ><rect x="20" y="56" width="589" height="630" stroke="#0A0F25" fill="#CFD2DD" class=" stroke-B1 fill-B4" style="stroke-width:2;" /></g><text x="314.5" y="43" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">Key Architectural Advantages of IPv6</text></g><g class="YWR2LmEx"><g class="shape" ><rect x="74" y="86" width="482" height="66" stroke="#0A0F25" fill="#dcfce7" class=" stroke-B1" style="stroke-width:2;" /></g><text x="315" y="124.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">1. Vast 128-Bit Address Space (3.4 x 10^38 IPs: Eliminates NAT)</text></g><g class="YWR2LmEy"><g class="shape" ><rect x="63" y="212" width="503" height="66" stroke="#0A0F25" fill="#dbeafe" class=" stroke-B1" style="stroke-width:2;" /></g><text x="314.5" y="250.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">2. Fixed 40-Byte Base Header: Faster router hardware processing</text></g><g class="YWR2LmEz"><g class="shape" ><rect x="71" y="338" width="487" height="66" stroke="#0A0F25" fill="#fef3c7" class=" stroke-B1" style="stroke-width:2;" /></g><text x="314.5" y="376.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">3. Stateless Address Autoconfiguration (SLAAC): Plug-and-play</text></g><g class="YWR2LmE0"><g class="shape" ><rect x="95" y="464" width="439" height="66" stroke="#0A0F25" fill="#f3e8ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="314.5" y="502.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">4. Built-in Security: Mandatory IPsec support (AH &amp; ESP)</text></g><g class="YWR2LmE1"><g class="shape" ><rect x="50" y="590" width="529" height="66" stroke="#0A0F25" fill="#e0e7ff" class=" stroke-B1" style="stroke-width:2;" /></g><text x="314.5" y="628.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">5. Elimination of Broadcast: Replaced by efficient Multicast / Anycast</text></g><mask id="d2-2882840014" maskUnits="userSpaceOnUse" x="-81" y="-85" width="791" height="872">
<rect x="-81" y="-85" width="791" height="872" fill="white"></rect>

