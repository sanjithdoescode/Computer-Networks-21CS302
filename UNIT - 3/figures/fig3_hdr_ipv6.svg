<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<rect x="10" y="10" width="800" height="352" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="410.0" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">RFC 8200: Internet Protocol Version 6 (IPv6) Base Header (Fixed 40 Octets)</text>
<rect x="40" y="50" width="740" height="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="43.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 0</text>
<text x="135.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 4</text>
<line x1="132.5" y1="50" x2="132.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="228.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 8</text>
<line x1="225.0" y1="50" x2="225.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="320.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 12</text>
<line x1="317.5" y1="50" x2="317.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="413.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 16</text>
<line x1="410.0" y1="50" x2="410.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="505.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 20</text>
<line x1="502.5" y1="50" x2="502.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.0" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 24</text>
<line x1="595.0" y1="50" x2="595.0" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="690.5" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 28</text>
<line x1="687.5" y1="50" x2="687.5" y2="78" stroke="#cbd5e1" stroke-width="1"/>
<text x="759.875" y="68" font-size="11" font-weight="600" fill="#64748b">Bit 31</text>
<rect x="40" y="78" width="92.5" height="44" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="86.25" y="97" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">Version (6)</text>
<text x="86.25" y="111" text-anchor="middle" font-size="8.5" font-weight="500" fill="#475569">4b (0110)</text>
<rect x="132.5" y="78" width="185.0" height="44" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="225.0" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Traffic Class</text>
<text x="225.0" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8b (DiffServ &amp; ECN)</text>
<rect x="317.5" y="78" width="462.5" height="44" fill="#fef3c7" stroke="#fde68a" stroke-width="1.2"/>
<text x="548.75" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Flow Label</text>
<text x="548.75" y="111" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">20 Bits (QoS / Real-Time Session Tag)</text>
<rect x="40" y="122" width="370.0" height="44" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.2"/>
<text x="225.0" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">Payload Length</text>
<text x="225.0" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">16 Bits (Bytes after 40B base header)</text>
<rect x="410.0" y="122" width="185.0" height="44" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="502.5" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Next Header</text>
<text x="502.5" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8 Bits (Extension header or Upper protocol)</text>
<rect x="595.0" y="122" width="185.0" height="44" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="687.5" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Hop Limit</text>
<text x="687.5" y="155" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">8 Bits (Replaces IPv4 TTL)</text>
<rect x="40" y="166" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Source IPv6 Address (128 Bits / 16 Octets) — Part 1 / 2</text>
<text x="410.0" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Upper 64 Bits (Global Routing Prefix + Subnet ID)</text>
<rect x="40" y="210" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="229" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Source IPv6 Address — Part 2 / 2</text>
<text x="410.0" y="243" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Lower 64 Bits (Interface ID / EUI-64)</text>
<rect x="40" y="254" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Destination IPv6 Address (128 Bits / 16 Octets) — Part 1 / 2</text>
<text x="410.0" y="287" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Upper 64 Bits (Routing Prefix + Subnet)</text>
<rect x="40" y="298" width="740.0" height="44" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
<text x="410.0" y="317" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Destination IPv6 Address — Part 2 / 2</text>
<text x="410.0" y="331" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Lower 64 Bits (Interface ID)</text>
</svg>